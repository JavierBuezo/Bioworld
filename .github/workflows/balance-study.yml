name: Ecological balance survey
on:
  push:
    paths: ['tests/balance-study.spec.js', '.github/workflows/balance-study.yml']
  workflow_dispatch:
jobs:
  survey:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save @playwright/test@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test tests/balance-study.spec.js --reporter=line
